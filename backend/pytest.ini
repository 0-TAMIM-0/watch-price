# pytest configuration
[pytest]
# Minimum Pytest version
minversion = 9.0

# Test paths - look in tests/ subdirectory
testpaths = tests

# Add options
addopts =
    -v
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-fail-under=80
