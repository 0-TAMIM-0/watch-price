apiVersion: v1
kind: Service

metadata:
  name: frontend
  namespace: watchprice

spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: watchprice

spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/0-tamim-0/watchprice-frontend:latest
          ports:
            - containerPort: 3000
          # Liveness: restart if nginx stops answering
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          # Readiness: send traffic only when nginx answers
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 128Mi
