apiVersion: apps/v1
kind: Deployment

metadata:
  name: worker
  namespace: watchprice

spec:
  # Keep 1: two workers would update every product twice per cycle
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/0-tamim-0/watchprice-worker:latest
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: watchprice-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: watchprice-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: watchprice-secret
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            # Read from the ConfigMap instead of the Secret
            - name: CHECK_INTERVAL_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: watchprice-config
                  key: CHECK_INTERVAL_MINUTES
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
