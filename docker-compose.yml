version: "3.9"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: watchprice-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "timezone=UTC"]
    networks:
      - watchprice-network


  # Flask Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: watchprice-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
    ports:
      - "5000:5000"
    volumes:
      # Development: code changes auto-reload
      - ./backend/app:/app/app
      - ./backend/run.py:/app/run.py
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - watchprice-network
    command: python run.py


  # Price Watcher Worker
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: watchprice-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CHECK_INTERVAL_MINUTES: ${CHECK_INTERVAL_MINUTES}
    volumes:
      # Development: code changes auto-reload
      - ./worker/config.py:/app/config.py
      - ./worker/price_simulator.py:/app/price_simulator.py
      - ./worker/worker.py:/app/worker.py
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - watchprice-network


# Vue Frontend
  frontend:
    build:
      context: ./frontend
      # dockerfile: Dockerfile
      dockerfile: Dockerfile.dev
    container_name: watchprice-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      - backend
    networks:
      - watchprice-network


volumes:
  postgres_data:
    driver: local


networks:
  watchprice-network:
    driver: bridge
